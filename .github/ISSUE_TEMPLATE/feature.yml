name: 기능 추가 (Feature)
description: 새로운 기능이나 기존 기능의 확장 요청
title: "[Feature] 작업내용"

assignees:
  - SonSeYoung02

body:
  - type: markdown
    attributes:
      value: |
        추가하려는 기능과 필요한 이유를 작성해 주세요.

  - type: textarea
    id: background
    attributes:
      label: 배경 (Background)
      description: 이 기능이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: |
        - 기능이 필요한 배경
        - 현재 겪고 있는 문제
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: 기능 설명
      description: 추가하려는 기능과 사용자가 이용하는 흐름을 작성해 주세요.
      placeholder: |
        - 추가할 기능
        - 사용 시나리오 및 예상 동작
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용 (Tasks)
      description: 구현할 작업을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
    validations:
      required: true

  - type: textarea
    id: expected-results
    attributes:
      label: 기대 효과 (Expected Results)
      description: 기능 추가 후 무엇이 개선되는지 작성해 주세요.
    validations:
      required: true
