name: 작업 이슈 (Task)
description: 기능 추가, 버그 수정, 리팩터링, 인프라/설정 작업 등록
title: "[접두사] 작업내용"

assignees:
  - SonSeYoung02

body:
  - type: markdown
    attributes:
      value: |
        제목 접두사는 작업에 맞게 [Feature], [Fix], [Refactor], [Docs], [Chore] 중 하나로 변경해 주세요.

  - type: textarea
    id: background
    attributes:
      label: 배경 (Background)
      description: 작업이 필요한 이유와 현행 문제점 또는 제약 사항을 작성해 주세요.
      placeholder: |
        - [작업 배경] 현재 문제점 또는 작업이 필요한 배경
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용 (Tasks)
      description: 진행할 작업을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
    validations:
      required: true

  - type: textarea
    id: expected-results
    attributes:
      label: 기대 효과 (Expected Results)
      description: 작업이 완료되면 무엇이 달라지는지 작성해 주세요.
      placeholder: |
        - [시스템/품질] 현재 작업을 통해서 도출될 기대 효과는 어떻게 되는가?
        - [시스템/품질] 오류가 줄어들거나 성능, 안정성이 어떻게 개선되는가?
        - [개발/운영] 유지보수, 자동화 관점에서 무엇이 편해지는가?
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 기타 참고 사항
      description: 관련 작업 문서(docs/작업/ 또는 openspec/changes/), 엔드포인트, DB 스키마 변경 여부 등을 작성해 주세요.
      placeholder: |
        - 코드를 작성할 개발자나 협업하는 개발자가 알아야하는 사항들
        - 인수인계가 필요한 사항들
    validations:
      required: true
